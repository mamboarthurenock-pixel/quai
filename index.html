<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c17">
<title>LPCC Companion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="head-row">
    <div class="logo">LP</div>
    <div class="head-titles">
      <h1>LPCC Companion</h1>
      <div class="sub">
        <span id="todayDate">—</span>
        <span class="dot-sep">•</span>
        <span class="clock mono" id="clock">--:--:--</span>
      </div>
    </div>
  </div>
</header>

<div class="app">
<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="today">
      <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><circle cx="8.5" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/><path d="M8 21l2-4M16 21l-2-4"/></svg></span>
      Aujourd'hui
    </button>
    <button class="nav-btn" data-tab="evening">
      <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      Soir
    </button>
    <button class="nav-btn" data-tab="courses">
      <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span>
      Cours
    </button>
    <button class="nav-btn" data-tab="coach">
      <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>
      Coach
    </button>
  </div>
</nav>

<main>
  <!-- ============ AUJOURD'HUI ============ -->
  <section class="tab active" id="tab-today">
    <div class="hero">
      <svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a1220"/>
            <stop offset="100%" stop-color="#0d1a2e"/>
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d9488" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#070c17" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="crane" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#0d9488"/>
          </linearGradient>
          <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e2a44"/>
            <stop offset="100%" stop-color="#0f1729"/>
          </linearGradient>
        </defs>
        <rect width="800" height="260" fill="url(#sky)"/>
        <!-- étoiles -->
        <g fill="#2dd4bf" opacity=".5">
          <circle cx="80" cy="40" r="1.2"/><circle cx="180" cy="70" r="1"/><circle cx="320" cy="30" r="1.4"/>
          <circle cx="480" cy="55" r="1"/><circle cx="620" cy="35" r="1.2"/><circle cx="720" cy="80" r="1"/>
          <circle cx="260" cy="90" r=".9"/><circle cx="560" cy="95" r="1.1"/>
        </g>
        <!-- grues -->
        <g stroke="url(#crane)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <g class="crane1">
            <path d="M120 170V90M120 90h70M120 90l-25 20M190 90v18"/>
            <path d="M190 108v14" stroke-dasharray="2 3"/>
          </g>
          <g class="crane2">
            <path d="M300 170V100M300 100h60M300 100l-20 16M360 100v14"/>
            <path d="M360 114v12" stroke-dasharray="2 3"/>
          </g>
        </g>
        <!-- conteneurs empilés -->
        <g>
          <rect x="60" y="150" width="34" height="20" rx="2" fill="#0d9488" opacity=".8"/>
          <rect x="60" y="130" width="34" height="20" rx="2" fill="#14b8a6" opacity=".7"/>
          <rect x="98" y="150" width="34" height="20" rx="2" fill="#2dd4bf" opacity=".6"/>
          <rect x="98" y="130" width="34" height="20" rx="2" fill="#0d9488" opacity=".8"/>
          <rect x="98" y="110" width="34" height="20" rx="2" fill="#14b8a6" opacity=".7"/>
          <rect x="240" y="150" width="34" height="20" rx="2" fill="#0d9488" opacity=".7"/>
          <rect x="240" y="130" width="34" height="20" rx="2" fill="#2dd4bf" opacity=".6"/>
        </g>
        <!-- navire -->
        <g class="ship">
          <path d="M420 190h300l-30 30H450z" fill="url(#ship)" stroke="#2dd4bf" stroke-opacity=".4" stroke-width="1.5"/>
          <rect x="470" y="160" width="60" height="30" rx="2" fill="#0f1729" stroke="#2dd4bf" stroke-opacity=".3"/>
          <rect x="540" y="150" width="50" height="40" rx="2" fill="#0f1729" stroke="#2dd4bf" stroke-opacity=".3"/>
          <rect x="600" y="165" width="70" height="25" rx="2" fill="#0f1729" stroke="#2dd4bf" stroke-opacity=".3"/>
          <rect x="680" y="155" width="30" height="35" rx="2" fill="#0f1729" stroke="#2dd4bf" stroke-opacity=".3"/>
          <rect x="470" y="160" width="60" height="6" fill="#2dd4bf" opacity=".5"/>
          <rect x="540" y="150" width="50" height="6" fill="#2dd4bf" opacity=".5"/>
          <rect x="600" y="165" width="70" height="6" fill="#2dd4bf" opacity=".5"/>
        </g>
        <!-- eau ondulante -->
        <g class="water">
          <path d="M0 210 Q100 200 200 210 T400 210 T600 210 T800 210 V260 H0 Z" fill="url(#water)"/>
          <path d="M0 220 Q100 212 200 220 T400 220 T600 220 T800 220" stroke="#2dd4bf" stroke-opacity=".3" stroke-width="1.5" fill="none"/>
          <path d="M0 232 Q100 224 200 232 T400 232 T600 232 T800 232" stroke="#2dd4bf" stroke-opacity=".2" stroke-width="1.5" fill="none"/>
          <path d="M0 244 Q100 236 200 244 T400 244 T600 244 T800 244" stroke="#2dd4bf" stroke-opacity=".12" stroke-width="1.5" fill="none"/>
        </g>
      </svg>
      <div class="hero-overlay">
        <div class="eyebrow">Port d'Abidjan · Terminal à conteneurs</div>
        <h2>Bienvenue sur <b>Le Quai</b></h2>
        <p>Ton compagnon de la filière Transport &amp; Logistique</p>
      </div>
    </div>
    <p class="section-title">Ligne du jour</p>
    <div id="todayContent"></div>
  </section>

  <!-- ============ SOIR ============ -->
  <section class="tab" id="tab-evening">
    <div class="tomorrow-head">
      <div class="day" id="tomorrowDay">Demain</div>
      <div class="tag">Préparation</div>
    </div>
    <div id="eveningContent"></div>
  </section>

  <!-- ============ COURS ============ -->
  <section class="tab" id="tab-courses">
    <div class="search-wrap">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input type="search" id="searchInput" placeholder="Rechercher une matière ou un sigle…" autocomplete="off">
    </div>
    <div id="coursesContent"></div>
  </section>

  <!-- ============ COACH ============ -->
  <section class="tab" id="tab-coach">
    <p class="section-title">Simulateur de liquidation douanière</p>
    <div class="card">
      <div class="field">
        <label for="fob">Valeur FOB (FCFA)</label>
        <input type="number" id="fob" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="fret">Fret (FCFA)</label>
          <input type="number" id="fret" inputmode="decimal" placeholder="0" min="0">
        </div>
        <div class="field">
          <label for="assurance">Assurance (FCFA)</label>
          <input type="number" id="assurance" inputmode="decimal" placeholder="0" min="0">
        </div>
      </div>
      <button class="btn" id="calcBtn">Calculer</button>
      <button class="btn ghost" id="resetBtn">Réinitialiser</button>
      <div class="score-line">
        <span>Calculs effectués</span>
        <span><b id="calcCount">0</b></span>
      </div>
      <div class="result" id="dutyResult"></div>
    </div>

    <p class="section-title">Convertisseur FCFA</p>
    <div class="card">
      <div class="field">
        <label for="convAmount">Montant</label>
        <input type="number" id="convAmount" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="convFrom">Devise source</label>
          <input type="text" id="convFrom" value="EUR" readonly style="text-align:center">
        </div>
        <div class="field">
          <label for="convTo">Devise cible</label>
          <input type="text" id="convTo" value="FCFA" readonly style="text-align:center">
        </div>
      </div>
      <div class="grid-2">
        <button class="btn" id="convEurBtn" style="font-size:13px">EUR → FCFA</button>
        <button class="btn" id="convUsdBtn" style="font-size:13px">USD → FCFA</button>
      </div>
      <div class="conv-out" id="convOut" style="display:none">
        <div class="big" id="convBig">—</div>
        <div class="small" id="convSmall"></div>
      </div>
    </div>
  </section>
</main>
</div>

<script src="app.js"></script>
</body>
</html>
