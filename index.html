<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c17">
<title>LPCC Companion</title>
<style>
  :root{
    --bg:#070c17;
    --card:#0f1729;
    --card-2:#131d33;
    --accent:#2dd4bf;
    --text:#eef2fa;
    --muted:#93a4c4;
    --amber:#fbbf24;
    --green:#34d399;
    --rose:#fb7185;
    --line:#1e2a44;
    --radius:16px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    background-image:radial-gradient(1200px 600px at 50% -200px,rgba(45,212,191,.08),transparent 70%);
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,12,23,.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-top)) 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .head-row{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
  .logo{
    width:42px;height:42px;flex:0 0 42px;border-radius:12px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#2dd4bf,#0d9488);
    color:#04211d;font-weight:800;letter-spacing:.5px;font-size:16px;
    box-shadow:0 6px 20px rgba(45,212,191,.28);
  }
  .head-titles{flex:1;min-width:0}
  .head-titles h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
  .head-titles .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .clock{color:var(--accent);font-weight:600}
  .dot-sep{opacity:.4}

  /* ---------- Layout ---------- */
  main{max-width:760px;margin:0 auto;padding:18px 16px 8px}
  .tab{display:none;animation:fadeUp .35s ease both}
  .tab.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .section-title{
    font-size:12px;text-transform:uppercase;letter-spacing:1.4px;
    color:var(--muted);margin:0 0 12px;font-weight:600;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }

  /* ---------- Metro timeline ---------- */
  .metro{position:relative;padding-left:0}
  .metro-rail{
    position:absolute;left:64px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,var(--line),#24314f,var(--line));
    border-radius:2px;
  }
  .stop{
    position:relative;display:grid;
    grid-template-columns:52px 24px 1fr;
    gap:0 8px;align-items:start;
    padding:10px 0;
  }
  .stop .time{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    text-align:right;padding-top:2px;line-height:1.35;
  }
  .stop .time .end{display:block;opacity:.55;font-size:11px}
  .stop .node{
    position:relative;display:grid;place-items:center;padding-top:3px;
  }
  .stop .node .ring{
    width:14px;height:14px;border-radius:50%;
    background:var(--card);border:2px solid #2a3a5c;
    position:relative;z-index:2;transition:.3s;
  }
  .stop .body{
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    transition:.3s;
  }
  .stop .subject{font-weight:650;font-size:14.5px;letter-spacing:.2px}
  .stop .teacher{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stop .badge{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;
    padding:2px 8px;border-radius:999px;margin-top:6px;
    background:rgba(45,212,191,.12);color:var(--accent);
  }

  /* past */
  .stop.past .body{opacity:.45;filter:saturate(.4)}
  .stop.past .ring{background:#1a2540;border-color:#2a3a5c}
  .stop.past .time{opacity:.5}

  /* current */
  .stop.current .body{
    border-color:rgba(45,212,191,.55);
    background:linear-gradient(180deg,rgba(45,212,191,.10),rgba(45,212,191,.03));
    box-shadow:0 0 0 1px rgba(45,212,191,.15),0 10px 30px -12px rgba(45,212,191,.5);
  }
  .stop.current .ring{
    background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 0 rgba(45,212,191,.6);
    animation:pulse 2s infinite;
  }
  .stop.current .subject{color:var(--accent)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(45,212,191,.55)}
    70%{box-shadow:0 0 0 12px rgba(45,212,191,0)}
    100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}
  }

  .empty{
    text-align:center;color:var(--muted);padding:36px 16px;
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty .big{font-size:34px;margin-bottom:8px}

  /* ---------- Soir ---------- */
  .tomorrow-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:14px;
  }
  .tomorrow-head .day{font-size:18px;font-weight:700}
  .tomorrow-head .tag{
    font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--amber);background:rgba(251,191,36,.12);
    padding:4px 10px;border-radius:999px;
  }
  .fiche h3{
    margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;
  }
  .fiche h3 .emoji{font-size:18px}
  .fiche ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
  .fiche li{margin:4px 0}
  .fiche li b{color:var(--text);font-weight:600}

  /* ---------- Cours ---------- */
  .search-wrap{position:relative;margin-bottom:16px}
  .search-wrap input{
    width:100%;padding:13px 14px 13px 42px;
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;color:var(--text);font-size:15px;outline:none;
    transition:.2s;
  }
  .search-wrap input:focus{border-color:rgba(45,212,191,.6);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
  .search-wrap .ico{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:16px;pointer-events:none;
  }
  .level-group{margin-bottom:18px}
  .level-head{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
  }
  .level-pill{
    font-size:11px;font-weight:800;letter-spacing:.8px;
    padding:3px 10px;border-radius:999px;
  }
  .lvl-3{background:rgba(45,212,191,.14);color:var(--accent)}
  .lvl-2{background:rgba(251,191,36,.14);color:var(--amber)}
  .lvl-1{background:rgba(251,113,133,.14);color:var(--rose)}
  .level-head .count{font-size:12px;color:var(--muted)}
  .subject-list{display:grid;gap:8px}
  .subject-item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;
    transition:.2s;
  }
  .subject-item:hover{border-color:#2a3a5c;transform:translateX(2px)}
  .subject-item .emoji{font-size:18px;width:24px;text-align:center}
  .subject-item .name{font-size:14px;font-weight:550;letter-spacing:.2px}

  .sigles-grid{display:grid;grid-template-columns:1fr;gap:8px}
  .sigle{
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;
  }
  .sigle .code{
    font-family:var(--mono);font-weight:700;color:var(--accent);
    font-size:13px;letter-spacing:.5px;
  }
  .sigle .def{font-size:13px;color:var(--muted);margin-top:2px}

  /* ---------- Coach ---------- */
  .field{margin-bottom:12px}
  .field label{
    display:block;font-size:12px;color:var(--muted);
    margin-bottom:6px;font-weight:600;letter-spacing:.3px;
  }
  .field input{
    width:100%;padding:12px 14px;
    background:var(--card-2);border:1px solid var(--line);
    border-radius:10px;color:var(--text);font-size:15px;
    font-family:var(--mono);outline:none;transition:.2s;
  }
  .field input:focus{border-color:rgba(45,212,191,.6);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(145deg,#2dd4bf,#14b8a6);
    color:#04211d;font-weight:800;font-size:15px;letter-spacing:.3px;
    cursor:pointer;transition:.2s;
    box-shadow:0 8px 24px -8px rgba(45,212,191,.6);
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{
    background:transparent;color:var(--muted);
    border:1px solid var(--line);box-shadow:none;font-weight:600;
    margin-top:8px;
  }

  .result{margin-top:16px;display:none}
  .result.show{display:block;animation:fadeUp .35s ease both}
  .result-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:9px 0;border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .result-row:last-child{border-bottom:none}
  .result-row .k{color:var(--muted)}
  .result-row .v{font-family:var(--mono);font-weight:600}
  .result-row.total{
    margin-top:6px;padding-top:14px;border-top:1px solid var(--line);
    border-bottom:none;
  }
  .result-row.total .k{color:var(--text);font-weight:700;font-size:14px}
  .result-row.total .v{color:var(--accent);font-size:18px;font-weight:800}
  .result-row .v.amber{color:var(--amber)}
  .result-row .v.green{color:var(--green)}
  .result-row .v.rose{color:var(--rose)}

  .conv-out{
    margin-top:14px;background:var(--card-2);border:1px solid var(--line);
    border-radius:12px;padding:14px;text-align:center;
  }
  .conv-out .big{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--accent)}
  .conv-out .small{font-size:12px;color:var(--muted);margin-top:4px}

  .score-line{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--muted);margin-top:10px;
  }
  .score-line b{color:var(--green)}

  /* ---------- Bottom nav ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(7,12,23,.9);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
  }
  .nav-inner{
    max-width:760px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  }
  .nav-btn{
    background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;border-radius:12px;cursor:pointer;
    font-size:11px;font-weight:600;letter-spacing:.2px;
    transition:.2s;font-family:inherit;
  }
  .nav-btn .ni{font-size:19px;line-height:1;transition:.2s}
  .nav-btn.active{color:var(--accent);background:rgba(45,212,191,.08)}
  .nav-btn.active .ni{transform:translateY(-1px)}

  @media(min-width:640px){
    .sigles-grid{grid-template-columns:1fr 1fr}
    .subject-list{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="logo">LP</div>
    <div class="head-titles">
      <h1>LPCC Companion</h1>
      <div class="sub">
        <span id="todayDate">—</span>
        <span class="dot-sep">•</span>
        <span class="clock mono" id="clock">--:--:--</span>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- ============ AUJOURD'HUI ============ -->
  <section class="tab active" id="tab-today">
    <p class="section-title">Ligne du jour</p>
    <div id="todayContent"></div>
  </section>

  <!-- ============ SOIR ============ -->
  <section class="tab" id="tab-evening">
    <div class="tomorrow-head">
      <div class="day" id="tomorrowDay">Demain</div>
      <div class="tag">Préparation</div>
    </div>
    <div id="eveningContent"></div>
  </section>

  <!-- ============ COURS ============ -->
  <section class="tab" id="tab-courses">
    <div class="search-wrap">
      <span class="ico">🔍</span>
      <input type="search" id="searchInput" placeholder="Rechercher une matière…" autocomplete="off">
    </div>
    <div id="coursesContent"></div>
  </section>

  <!-- ============ COACH ============ -->
  <section class="tab" id="tab-coach">
    <p class="section-title">Simulateur de liquidation douanière</p>
    <div class="card">
      <div class="field">
        <label for="fob">Valeur FOB (FCFA)</label>
        <input type="number" id="fob" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="fret">Fret (FCFA)</label>
          <input type="number" id="fret" inputmode="decimal" placeholder="0" min="0">
        </div>
        <div class="field">
          <label for="assurance">Assurance (FCFA)</label>
          <input type="number" id="assurance" inputmode="decimal" placeholder="0" min="0">
        </div>
      </div>
      <button class="btn" id="calcBtn">Calculer</button>
      <button class="btn ghost" id="resetBtn">Réinitialiser</button>
      <div class="score-line">
        <span>Calculs effectués</span>
        <span><b id="calcCount">0</b></span>
      </div>
      <div class="result" id="dutyResult"></div>
    </div>

    <p class="section-title">Convertisseur FCFA</p>
    <div class="card">
      <div class="field">
        <label for="convAmount">Montant</label>
        <input type="number" id="convAmount" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="convFrom">Devise source</label>
          <input type="text" id="convFrom" value="EUR" readonly style="text-align:center">
        </div>
        <div class="field">
          <label for="convTo">Devise cible</label>
          <input type="text" id="convTo" value="FCFA" readonly style="text-align:center">
        </div>
      </div>
      <div class="grid-2">
        <button class="btn" id="convEurBtn" style="font-size:13px">EUR → FCFA</button>
        <button class="btn" id="convUsdBtn" style="font-size:13px">USD → FCFA</button>
      </div>
      <div class="conv-out" id="convOut" style="display:none">
        <div class="big" id="convBig">—</div>
        <div class="small" id="convSmall"></div>
      </div>
    </div>
  </section>
</main>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="today"><span class="ni">🚇</span>Aujourd'hui</button>
    <button class="nav-btn" data-tab="evening"><span class="ni">🌙</span>Soir</button>
    <button class="nav-btn" data-tab="courses"><span class="ni">📚</span>Cours</button>
    <button class="nav-btn" data-tab="coach"><span class="ni">🧭</span>Coach</button>
  </div>
</nav>

    "Droit":["Revoir les sources du droit","Fiche mémo : hiérarchie des normes","Exercices d'application"],
    "GOL":["Définir la logistique globale","Schéma des flux : approvisionnement → distribution","Relire les notes de M. Yao Kouassi"],
    "CMC":["Réviser la classification douanière","Exercices sur le TEC","Mémoriser les codes SH"],
    "TEF":["Vocabulaire ferroviaire","Relire le cours sur les wagons","Préparer un exposé court"],
    "TRM":["Réviser les types de marchandises","Fiche sur le transport routier marchandises","Exercices de calcul de tonnage"],
    "Éco Ent":["Revoir la notion d'entreprise","Fiche : les formes juridiques","Exercices sur le chiffre d'affaires"],
    "EPS":["Tenue de sport","Hydratation","Échauffement mental"],
    "TMM":["Réviser le transport maritime mondial","Fiche sur les types de navires","Relire les notes de M. Yao Konan"],
    "Entrepreneuriat":["Idée de projet : business model","Fiche sur le plan d'affaires","Préparer une présentation"],
    "GDOD":["Réviser la documentation douanière","Fiche sur le DAU","Relire les notes de M. Drouin"],
    "Maths":["Revoir les pourcentages","Exercices de calcul commercial","Fiche formules"],
    "TRV":["Réviser le transport routier voyageurs","Fiche sur les gares routières","Relire les notes de Mme Kouacou"],
    "Éco Gén":["Revoir les agents économiques","Fiche sur le circuit économique","Exercices d'application"],
    "TAM":["Réviser le transport aérien de marchandises","Fiche sur les types d'avions cargo","Relire les notes de M. Esse"],
    "Anglais":["Vocabulaire transport/logistique","Relire le texte étudié","Préparer 5 phrases d'expression"]
  };

  /* ============================================================
     UTILITAIRES
     ============================================================ */

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function pad(n){ return String(n).padStart(2,"0"); }

  function toMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + m;
  }

  function nowMinutes(d){
    return d.getHours()*60 + d.getMinutes();
  }

  function fmtFCFA(n){
    return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Math.round(n)) + " FCFA";
  }

  function fmtNum(n){
    return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  /* ============================================================
     STORAGE
     ============================================================ */

  const STORE_KEY = "lpcc_companion_v1";

  function loadStore(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {calcCount:0, lastCalc:null, quiz:{}};
      const obj = JSON.parse(raw);
      return Object.assign({calcCount:0, lastCalc:null, quiz:{}}, obj);
    }catch(e){
      return {calcCount:0, lastCalc:null, quiz:{}};
    }
  }

  function saveStore(s){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
  }

  let store = loadStore();

  /* ============================================================
     HEADER : date + horloge
     ============================================================ */

  function updateHeader(){
    const d = new Date();
    const dateStr = d.toLocaleDateString("fr-FR",{
      weekday:"long", day:"numeric", month:"long", year:"numeric"
    });
    $("#todayDate").textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    $("#clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  }

  /* ============================================================
     ONGLET AUJOURD'HUI
     ============================================================ */

  function renderToday(){
    const d = new Date();
    const dayIdx = d.getDay(); // 0 = dimanche
    const courses = SCHEDULE[dayIdx];
    const container = $("#todayContent");

    if(!courses || courses.length === 0){
      container.innerHTML = `
        <div class="empty">
          <div class="big">🌙</div>
          <div>Pas de cours aujourd'hui — ${DAY_NAMES[dayIdx]}.</div>
          <div style="margin-top:6px;font-size:13px">Profite pour préparer la suite dans l'onglet Soir.</div>
        </div>`;
      return;
    }

    const now = nowMinutes(d);
    let currentIdx = -1;
    courses.forEach((c,i) => {
      const s = toMinutes(c.start), e = toMinutes(c.end);
      if(now >= s && now < e) currentIdx = i;
    });

    let html = '<div class="metro"><div class="metro-rail"></div>';
    courses.forEach((c,i) => {
      const s = toMinutes(c.start), e = toMinutes(c.end);
      let cls = "stop";
      if(now >= e) cls += " past";
      else if(now >= s && now < e) cls += " current";

      let badge = "";
      if(cls.includes("current")) badge = '<span class="badge">EN COURS</span>';
      else if(now < s && (currentIdx === -1 || i === currentIdx + 1)) badge = '<span class="badge">À SUIVRE</span>';

      html += `
        <div class="${cls}">
          <div class="time">${c.start}<span class="end">${c.end}</span></div>
          <div class="node"><div class="ring"></div></div>
          <div class="body">
            <div class="subject">${escapeHtml(c.subject)}</div>
            <div class="teacher">${escapeHtml(c.teacher)}</div>
            ${badge}
          </div>
        </div>`;
    });
    html += "</div>";
    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET SOIR
     ============================================================ */

  function renderEvening(){
    const d = new Date();
    const tomorrowIdx = (d.getDay() + 1) % 7;
    const courses = SCHEDULE[tomorrowIdx];
    const container = $("#eveningContent");

    $("#tomorrowDay").textContent = "Demain — " + DAY_NAMES[tomorrowIdx];

    if(!courses || courses.length === 0){
      container.innerHTML = `
        <div class="empty">
          <div class="big">☕</div>
          <div>Pas de cours demain (${DAY_NAMES[tomorrowIdx]}).</div>
          <div style="margin-top:6px;font-size:13px">Repose-toi bien.</div>
        </div>`;
      return;
    }

    let html = "";
    courses.forEach(c => {
      const key = c.subject;
      const bullets = FICHES[key] || [
        "Relire le cours et les notes",
        "Préparer les questions à poser",
        "Faire une fiche mémo de 5 lignes"
      ];
      html += `
        <div class="card fiche">
          <h3><span class="emoji">📘</span>${escapeHtml(c.subject)}</h3>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
            ${c.start} – ${c.end} · ${escapeHtml(c.teacher)}
          </div>
          <ul>
            ${bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
          </ul>
        </div>`;
    });
    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET COURS
     ============================================================ */

  function renderCourses(filter){
    const q = (filter || "").trim().toLowerCase();
    const container = $("#coursesContent");
    let html = "";

    const levels = [
      {key:"3BT", cls:"lvl-3"},
      {key:"2BT", cls:"lvl-2"},
      {key:"1BT", cls:"lvl-1"}
    ];

    levels.forEach(lv => {
      const items = SUBJECTS[lv.key].filter(([name]) =>
        !q || name.toLowerCase().includes(q)
      );
      if(items.length === 0) return;
      html += `
        <div class="level-group">
          <div class="level-head">
            <span class="level-pill ${lv.cls}">${lv.key}</span>
            <span class="count">${items.length} matière${items.length>1?"s":""}</span>
          </div>
          <div class="subject-list">
            ${items.map(([name,emoji]) => `
              <div class="subject-item">
                <span class="emoji">${emoji}</span>
                <span class="name">${escapeHtml(name)}</span>
              </div>`).join("")}
          </div>
        </div>`;
    });

    // Sigles
    const sigleEntries = Object.entries(SIGLES).filter(([code,def]) =>
      !q || code.toLowerCase().includes(q) || def.toLowerCase().includes(q)
    );
    if(sigleEntries.length > 0){
      html += `
        <div class="level-group">
          <div class="level-head">
            <span class="level-pill lvl-3">SIGLES TLT</span>
            <span class="count">${sigleEntries.length} entrée${sigleEntries.length>1?"s":""}</span>
          </div>
          <div class="sigles-grid">
            ${sigleEntries.map(([code,def]) => `
              <div class="sigle">
                <div class="code">${escapeHtml(code)}</div>
                <div class="def">${escapeHtml(def)}</div>
              </div>`).join("")}
          </div>
        </div>`;
    }

    if(!html){
      html = `<div class="empty"><div class="big">🔍</div><div>Aucun résultat pour « ${escapeHtml(filter)} ».</div></div>`;
    }

    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET COACH — Simulateur douanier
     ============================================================ */

  function computeDuty(){
    const fob = parseFloat($("#fob").value) || 0;
    const fret = parseFloat($("#fret").value) || 0;
    const assurance = parseFloat($("#assurance").value) || 0;

    if(fob <= 0){
      alert("Veuillez saisir une valeur FOB supérieure à 0.");
      return;
    }

    const cif = fob + fret + assurance;
    const dd = cif * 0.10;
    const rsta = cif * 0.01;
    const baseTva = cif + dd + rsta;
    const tva = baseTva * 0.18;
    const total = dd + rsta + tva;
    const totalGeneral = cif + total;

    const result = {fob, fret, assurance, cif, dd, rsta, tva, total, totalGeneral};

    const box = $("#dutyResult");
    box.innerHTML = `
      <div class="result-row"><span class="k">Valeur FOB</span><span class="v">${fmtFCFA(fob)}</span></div>
      <div class="result-row"><span class="k">+ Fret</span><span class="v">${fmtFCFA(fret)}</span></div>
      <div class="result-row"><span class="k">+ Assurance</span><span class="v">${fmtFCFA(assurance)}</span></div>
      <div class="result-row"><span class="k"><b>Valeur CIF</b></span><span class="v amber">${fmtFCFA(cif)}</span></div>
      <div class="result-row"><span class="k">Droit de Douane (10 %)</span><span class="v">${fmtFCFA(dd)}</span></div>
      <div class="result-row"><span class="k">RSTA (1 %)</span><span class="v">${fmtFCFA(rsta)}</span></div>
      <div class="result-row"><span class="k">Base TVA (CIF + DD + RSTA)</span><span class="v">${fmtFCFA(baseTva)}</span></div>
      <div class="result-row"><span class="k">TVA (18 %)</span><span class="v">${fmtFCFA(tva)}</span></div>
      <div class="result-row"><span class="k">Total taxes</span><span class="v rose">${fmtFCFA(total)}</span></div>
      <div class="result-row total"><span class="k">Coût total (CIF + taxes)</span><span class="v">${fmtFCFA(totalGeneral)}</span></div>
    `;
    box.classList.add("show");

    store.calcCount = (store.calcCount || 0) + 1;
    store.lastCalc = result;
    saveStore(store);
    $("#calcCount").textContent = store.calcCount;
  }

  function resetDuty(){
    $("#fob").value = "";
    $("#fret").value = "";
    $("#assurance").value = "";
    $("#dutyResult").classList.remove("show");
    $("#dutyResult").innerHTML = "";
  }

  /* ============================================================
     CONVERTISSEUR
     ============================================================ */

  const RATES = {EUR: 656, USD: 605};

  function convert(rate, label){
    const amount = parseFloat($("#convAmount").value) || 0;
    if(amount <= 0){
      alert("Veuillez saisir un montant supérieur à 0.");
      return;
    }
    const result = amount * rate;
    $("#convOut").style.display = "block";
    $("#convBig").textContent = fmtFCFA(result);
    $("#convSmall").textContent = `${fmtNum(amount)} ${label} × ${rate} FCFA`;
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */

  function switchTab(name){
    $$(".tab").forEach(t => t.classList.remove("active"));
    $$(".nav-btn").forEach(b => b.classList.remove("active"));
    const tab = $("#tab-" + name);
    const btn = document.querySelector(`.nav-btn[data-tab="${name}"]`);
    if(tab) tab.classList.add("active");
    if(btn) btn.classList.add("active");
    window.scrollTo({top:0, behavior:"smooth"});
  }

  /* ============================================================
     INIT
     ============================================================ */

  function init(){
    updateHeader();
    setInterval(updateHeader, 1000);

    renderToday();
    renderEvening();
    renderCourses("");
    $("#calcCount").textContent = store.calcCount || 0;

    // Rafraîchir l'onglet Aujourd'hui toutes les 30 s
    setInterval(renderToday, 30000);

    // Navigation
    $$(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    // Recherche
    $("#searchInput").addEventListener("input", (e) => {
      renderCourses(e.target.value);
    });

    // Simulateur
    $("#calcBtn").addEventListener("click", computeDuty);
    $("#resetBtn").addEventListener("click", resetDuty);

    // Convertisseur
    $("#convEurBtn").addEventListener("click", () => convert(RATES.EUR, "EUR"));
    $("#convUsdBtn").addEventListener("click", () => convert(RATES.USD, "USD"));
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
