<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c17">
<title>LPCC Companion</title>
<style>
  :root{
    --bg:#070c17;
    --bg-2:#0a1220;
    --card:rgba(15,23,41,.7);
    --card-solid:#0f1729;
    --card-2:rgba(19,29,51,.75);
    --accent:#2dd4bf;
    --accent-2:#14b8a6;
    --accent-glow:rgba(45,212,191,.35);
    --text:#eef2fa;
    --muted:#93a4c4;
    --amber:#fbbf24;
    --green:#34d399;
    --rose:#fb7185;
    --line:rgba(45,212,191,.15);
    --line-soft:rgba(148,163,184,.12);
    --radius:18px;
    --radius-sm:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 20px 50px -20px rgba(0,0,0,.6);
    --shadow-glow:0 0 24px rgba(45,212,191,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    min-height:100vh;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    background-image:
      radial-gradient(900px 500px at 100% 0%,rgba(45,212,191,.10),transparent 60%),
      radial-gradient(900px 600px at 0% 100%,rgba(59,130,246,.10),transparent 60%),
      linear-gradient(180deg,#070c17 0%,#0a1220 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,12,23,.72);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--line-soft);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  }
  .head-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
  .logo{
    width:46px;height:46px;flex:0 0 46px;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#2dd4bf,#0d9488);
    color:#04211d;font-weight:800;letter-spacing:.5px;font-size:15px;
    box-shadow:0 8px 24px rgba(45,212,191,.35),inset 0 1px 0 rgba(255,255,255,.3);
    position:relative;overflow:hidden;
  }
  .logo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-100%);
    animation:shimmer 4s ease-in-out infinite;
  }
  .head-titles{flex:1;min-width:0}
  .head-titles h1{
    margin:0;font-size:17px;font-weight:600;letter-spacing:.3px;
    background:linear-gradient(90deg,#eef2fa 0%,#2dd4bf 50%,#eef2fa 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmerText 8s linear infinite;
  }
  .head-titles .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .clock{color:var(--accent);font-weight:600;text-shadow:0 0 12px rgba(45,212,191,.5)}
  .dot-sep{opacity:.4}

  /* ---------- Layout ---------- */
  .app{max-width:1180px;margin:0 auto;display:block}
  main{padding:20px 16px 8px}
  .tab{display:none}
  .tab.active{display:block}
  .tab.active > *{animation:fadeInUp .5s cubic-bezier(.2,.7,.2,1) both}
  .tab.active > *:nth-child(1){animation-delay:0ms}
  .tab.active > *:nth-child(2){animation-delay:60ms}
  .tab.active > *:nth-child(3){animation-delay:120ms}
  .tab.active > *:nth-child(4){animation-delay:180ms}
  .tab.active > *:nth-child(5){animation-delay:240ms}
  .tab.active > *:nth-child(6){animation-delay:300ms}
  .tab.active > *:nth-child(7){animation-delay:360ms}
  .tab.active > *:nth-child(8){animation-delay:420ms}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
  @keyframes shimmerText{to{background-position:200% center}}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.55),0 0 20px rgba(45,212,191,.35)}
    50%{box-shadow:0 0 0 10px rgba(45,212,191,0),0 0 30px rgba(45,212,191,.55)}
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  @keyframes railDot{
    0%{top:0;opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    100%{top:100%;opacity:0}
  }
  @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:2px;
    color:var(--muted);margin:0 0 14px;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .section-title::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,var(--line),transparent);
  }

  .card{
    background:var(--card);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(600px 200px at 0% 0%,rgba(45,212,191,.06),transparent 60%);
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(45,212,191,.35);
    box-shadow:var(--shadow),0 0 30px -8px rgba(45,212,191,.35);
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    margin-bottom:22px;
    border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(13,148,136,.18),rgba(15,23,41,.6) 60%);
    box-shadow:var(--shadow),0 0 40px -20px rgba(45,212,191,.5);
  }
  .hero svg{display:block;width:100%;height:auto}
  .hero-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:20px 22px;
    background:linear-gradient(180deg,transparent 40%,rgba(7,12,23,.85) 100%);
    pointer-events:none;
  }
  .hero-overlay .eyebrow{
    font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:6px;
    text-shadow:0 0 12px rgba(45,212,191,.6);
  }
  .hero-overlay h2{
    margin:0;font-size:clamp(20px,4vw,28px);font-weight:300;letter-spacing:.5px;
    line-height:1.15;
  }
  .hero-overlay h2 b{font-weight:700;color:var(--accent);text-shadow:0 0 20px rgba(45,212,191,.5)}
  .hero-overlay p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}

  /* ---------- Metro timeline ---------- */
  .metro{position:relative;padding-left:0}
  .metro-rail{
    position:absolute;left:64px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,transparent,var(--line),rgba(45,212,191,.4),var(--line),transparent);
    border-radius:2px;overflow:hidden;
  }
  .metro-rail::after{
    content:"";position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px 3px rgba(45,212,191,.8);
    animation:railDot 6s linear infinite;
  }
  .stop{
    position:relative;display:grid;
    grid-template-columns:52px 24px 1fr;
    gap:0 10px;align-items:start;
    padding:10px 0;
  }
  .stop .time{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    text-align:right;padding-top:4px;line-height:1.35;
  }
  .stop .time .end{display:block;opacity:.55;font-size:11px}
  .stop .node{position:relative;display:grid;place-items:center;padding-top:5px}
  .stop .node .ring{
    width:14px;height:14px;border-radius:50%;
    background:var(--card-solid);border:2px solid #2a3a5c;
    position:relative;z-index:2;transition:.3s;
  }
  .stop .body{
    background:var(--card-2);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:12px 14px;
    transition:transform .3s,border-color .3s,box-shadow .3s;
  }
  .stop .body:hover{transform:translateY(-2px);border-color:rgba(45,212,191,.3)}
  .stop .subject{font-weight:600;font-size:14.5px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .stop .subject svg{width:16px;height:16px;flex:0 0 16px;color:var(--accent);opacity:.85}
  .stop .teacher{font-size:12.5px;color:var(--muted);margin-top:3px}
  .stop .badge{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;
    padding:3px 9px;border-radius:999px;margin-top:8px;
    background:rgba(45,212,191,.14);color:var(--accent);
    border:1px solid rgba(45,212,191,.25);
  }

  .stop.past .body{opacity:.45;filter:saturate(.4)}
  .stop.past .ring{background:#1a2540;border-color:#2a3a5c}
  .stop.past .time{opacity:.5}

  .stop.current .body{
    border-color:rgba(45,212,191,.55);
    background:linear-gradient(180deg,rgba(45,212,191,.12),rgba(45,212,191,.03));
    box-shadow:0 0 0 1px rgba(45,212,191,.15),0 12px 34px -14px rgba(45,212,191,.6);
  }
  .stop.current .ring{
    background:var(--accent);border-color:var(--accent);
    animation:pulseGlow 2.2s ease-in-out infinite;
  }
  .stop.current .subject{color:var(--accent);text-shadow:0 0 14px rgba(45,212,191,.5)}

  .empty{
    text-align:center;color:var(--muted);padding:40px 16px;
    border:1px dashed var(--line);border-radius:var(--radius);
    background:var(--card);
    backdrop-filter:blur(10px);
  }
  .empty .big{font-size:36px;margin-bottom:10px;animation:float 4s ease-in-out infinite}

  /* ---------- Soir ---------- */
  .tomorrow-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:16px;
  }
  .tomorrow-head .day{font-size:20px;font-weight:300;letter-spacing:.3px}
  .tomorrow-head .day b{font-weight:700;color:var(--accent)}
  .tomorrow-head .tag{
    font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--amber);background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.25);
    padding:5px 12px;border-radius:999px;
  }
  .fiche h3{
    margin:0 0 10px;font-size:15px;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .fiche h3 svg{width:20px;height:20px;color:var(--accent);flex:0 0 20px}
  .fiche .meta{font-size:12px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)}
  .fiche ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
  .fiche li{margin:5px 0}
  .fiche li::marker{color:var(--accent)}

  /* ---------- Cours ---------- */
  .search-wrap{position:relative;margin-bottom:18px}
  .search-wrap input{
    width:100%;padding:14px 16px 14px 46px;
    background:var(--card);backdrop-filter:blur(12px);
    border:1px solid var(--line);
    border-radius:14px;color:var(--text);font-size:15px;outline:none;
    transition:.25s;font-family:var(--sans);
  }
  .search-wrap input:focus{
    border-color:rgba(45,212,191,.6);
    box-shadow:0 0 0 3px rgba(45,212,191,.12),0 0 24px -6px rgba(45,212,191,.4);
  }
  .search-wrap .ico{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;display:grid;place-items:center;
  }
  .search-wrap .ico svg{width:18px;height:18px}
  .level-group{margin-bottom:22px}
  .level-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .level-pill{
    font-size:10.5px;font-weight:800;letter-spacing:1px;
    padding:4px 12px;border-radius:999px;
  }
  .lvl-3{background:rgba(45,212,191,.14);color:var(--accent);border:1px solid rgba(45,212,191,.3)}
  .lvl-2{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
  .lvl-1{background:rgba(251,113,133,.14);color:var(--rose);border:1px solid rgba(251,113,133,.3)}
  .level-head .count{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .subject-list{display:grid;gap:10px}
  .subject-item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);backdrop-filter:blur(10px);
    border:1px solid var(--line-soft);
    border-radius:14px;padding:12px 14px;
    transition:transform .25s,border-color .25s,box-shadow .25s;
  }
  .subject-item:hover{
    border-color:rgba(45,212,191,.35);
    transform:translateY(-3px);
    box-shadow:0 12px 30px -14px rgba(45,212,191,.5);
  }
  .subject-item .ico{
    width:32px;height:32px;flex:0 0 32px;border-radius:10px;
    display:grid;place-items:center;
    background:rgba(45,212,191,.1);
    color:var(--accent);
  }
  .subject-item .ico svg{width:18px;height:18px}
  .subject-item .name{font-size:14px;font-weight:500;letter-spacing:.2px}

  .sigles-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .sigle{
    background:var(--card);backdrop-filter:blur(10px);
    border:1px solid var(--line-soft);
    border-radius:14px;padding:12px 14px;
    transition:transform .25s,border-color .25s;
  }
  .sigle:hover{transform:translateY(-2px);border-color:rgba(45,212,191,.3)}
  .sigle .code{
    font-family:var(--mono);font-weight:700;color:var(--accent);
    font-size:13px;letter-spacing:.5px;
    text-shadow:0 0 12px rgba(45,212,191,.4);
  }
  .sigle .def{font-size:13px;color:var(--muted);margin-top:3px}

  /* ---------- Coach ---------- */
  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:11px;color:var(--muted);
    margin-bottom:7px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  }
  .field input{
    width:100%;padding:13px 15px;
    background:rgba(7,12,23,.6);border:1px solid var(--line-soft);
    border-radius:12px;color:var(--text);font-size:15px;
    font-family:var(--mono);outline:none;transition:.25s;
  }
  .field input:focus{
    border-color:rgba(45,212,191,.6);
    box-shadow:0 0 0 3px rgba(45,212,191,.12),0 0 20px -6px rgba(45,212,191,.4);
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{
    width:100%;padding:15px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#2dd4bf,#14b8a6,#0d9488);
    background-size:200% 200%;
    color:#04211d;font-weight:800;font-size:15px;letter-spacing:.4px;
    cursor:pointer;transition:transform .2s,box-shadow .3s,background-position .6s;
    box-shadow:0 10px 30px -10px rgba(45,212,191,.7);
    font-family:var(--sans);
  }
  .btn:hover{
    background-position:100% 50%;
    box-shadow:0 12px 40px -8px rgba(45,212,191,.9),0 0 24px rgba(45,212,191,.5);
    transform:translateY(-1px);
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{
    background:transparent;color:var(--muted);
    border:1px solid var(--line-soft);box-shadow:none;font-weight:600;
    margin-top:10px;
  }
  .btn.ghost:hover{border-color:rgba(45,212,191,.4);color:var(--text);box-shadow:none}

  .result{margin-top:18px;display:none}
  .result.show{display:block;animation:fadeInUp .4s ease both}
  .result-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:10px 0;border-bottom:1px dashed var(--line-soft);
    font-size:13.5px;
  }
  .result-row:last-child{border-bottom:none}
  .result-row .k{color:var(--muted)}
  .result-row .v{font-family:var(--mono);font-weight:600}
  .result-row.total{
    margin-top:8px;padding-top:16px;border-top:1px solid var(--line);
    border-bottom:none;
  }
  .result-row.total .k{color:var(--text);font-weight:700;font-size:14px}
  .result-row.total .v{color:var(--accent);font-size:19px;font-weight:800;text-shadow:0 0 16px rgba(45,212,191,.5)}
  .result-row .v.amber{color:var(--amber)}
  .result-row .v.green{color:var(--green)}
  .result-row .v.rose{color:var(--rose)}

  .conv-out{
    margin-top:16px;background:rgba(7,12,23,.6);border:1px solid var(--line);
    border-radius:14px;padding:18px;text-align:center;
    box-shadow:inset 0 0 30px -10px rgba(45,212,191,.2);
  }
  .conv-out .big{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--accent);text-shadow:0 0 20px rgba(45,212,191,.5)}
  .conv-out .small{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--mono)}

  .score-line{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--muted);margin-top:12px;
  }
  .score-line b{color:var(--green);font-family:var(--mono)}

  /* ---------- Nav ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(7,12,23,.82);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-top:1px solid var(--line-soft);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  }
  .nav-btn{
    background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 4px;border-radius:14px;cursor:pointer;
    font-size:10.5px;font-weight:600;letter-spacing:.3px;
    transition:.25s;font-family:inherit;
  }
  .nav-btn .ni{display:grid;place-items:center;transition:.25s}
  .nav-btn .ni svg{width:20px;height:20px}
  .nav-btn.active{
    color:var(--accent);
    background:rgba(45,212,191,.1);
    box-shadow:inset 0 0 0 1px rgba(45,212,191,.2),0 0 20px -6px rgba(45,212,191,.5);
  }
  .nav-btn.active .ni{transform:translateY(-1px);filter:drop-shadow(0 0 6px rgba(45,212,191,.7))}

  /* ---------- Responsive ---------- */
  @media(min-width:640px){
    .sigles-grid{grid-template-columns:1fr 1fr}
    .subject-list{grid-template-columns:1fr 1fr}
  }
  @media(min-width:900px){
    body{padding-bottom:24px}
    .app{display:grid;grid-template-columns:220px 1fr;gap:0;align-items:start}
    nav{
      position:sticky;top:0;left:auto;right:auto;bottom:auto;
      height:100vh;border-top:none;border-right:1px solid var(--line-soft);
      padding:24px 12px;background:rgba(7,12,23,.5);
    }
    .nav-inner{grid-template-columns:1fr;gap:6px;position:sticky;top:24px}
    .nav-btn{
      flex-direction:row;justify-content:flex-start;gap:12px;
      padding:12px 14px;font-size:13px;border-radius:12px;
    }
    .nav-btn .ni svg{width:18px;height:18px}
    main{padding:28px 32px 40px}
    .hero-overlay{padding:28px 32px}
  }
  @media(min-width:1200px){
    .app{grid-template-columns:240px 1fr}
  }

  /* ---------- Reduced motion ---------- */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
    .metro-rail::after{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="logo">LP</div>
    <div class="head-titles">
      <h1>LPCC Companion</h1>
      <div class="sub">
        <span id="todayDate">—</span>
        <span class="dot-sep">•</span>
        <span class="clock mono" id="clock">--:--:--</span>
      </div>
    </div>
  </div>
</header>

<div class="app">
<nav>

    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>',
    calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>',
    ruler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg>',
    briefcase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>'
  };

  // Associe un mot-clé de matière à une icône SVG
  function iconFor(name){
    const n = name.toLowerCase();
    if(n.includes("maritime") || n.includes("tmm")) return ICONS.ship;
    if(n.includes("aérien") || n.includes("tam")) return ICONS.plane;
    if(n.includes("ferroviaire") || n.includes("tef")) return ICONS.train;
    if(n.includes("routier") || n.includes("trm") || n.includes("trv") || n.includes("tfmv")) return ICONS.truck;
    if(n.includes("conteneur") || n.includes("cmc") || n.includes("logistique")) return ICONS.container;
    if(n.includes("droit")) return ICONS.scale;
    if(n.includes("douan") || n.includes("gdod")) return ICONS.stamp;
    if(n.includes("math")) return ICONS.sigma;
    if(n.includes("anglais")) return ICONS.globe;
    if(n.includes("éco") || n.includes("eco")) return ICONS.chart;
    if(n.includes("entrepreneur")) return ICONS.bulb;
    if(n.includes("informatique")) return ICONS.cpu;
    if(n.includes("eps")) return ICONS.run;
    if(n.includes("edhc") || n.includes("vie familiale")) return ICONS.handshake;
    if(n.includes("conduite")) return ICONS.car;
    if(n.includes("entrepôt") || n.includes("entrepot")) return ICONS.warehouse;
    if(n.includes("itinéraire") || n.includes("itineraire")) return ICONS.map;
    if(n.includes("planification")) return ICONS.calendar;
    if(n.includes("affectation")) return ICONS.bus;
    if(n.includes("gestion")) return ICONS.briefcase;
    return ICONS.book;
  }

  function pad(n){ return String(n).padStart(2,"0"); }

  function toMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + m;
  }

  function nowMinutes(d){
    return d.getHours()*60 + d.getMinutes();
  }

  function fmtFCFA(n){
    return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Math.round(n)) + " FCFA";
  }

  function fmtNum(n){
    return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  /* ============================================================
     STORAGE
     ============================================================ */

  const STORE_KEY = "lpcc_companion_v1";

  function loadStore(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {calcCount:0, lastCalc:null, quiz:{}};
      const obj = JSON.parse(raw);
      return Object.assign({calcCount:0, lastCalc:null, quiz:{}}, obj);
    }catch(e){
      return {calcCount:0, lastCalc:null, quiz:{}};
    }
  }

  function saveStore(s){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
  }

  let store = loadStore();

  /* ============================================================
     HEADER : date + horloge
     ============================================================ */

  function updateHeader(){
    const d = new Date();
    const dateStr = d.toLocaleDateString("fr-FR",{
      weekday:"long", day:"numeric", month:"long", year:"numeric"
    });
    $("#todayDate").textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    $("#clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  }

  /* ============================================================
     ONGLET AUJOURD'HUI
     ============================================================ */

  function renderToday(){
    const d = new Date();
    const dayIdx = d.getDay(); // 0 = dimanche
    const courses = SCHEDULE[dayIdx];
    const container = $("#todayContent");

    if(!courses || courses.length === 0){
      container.innerHTML = `
        <div class="empty">
          <div class="big">🌙</div>
          <div>Pas de cours aujourd'hui — ${DAY_NAMES[dayIdx]}.</div>
          <div style="margin-top:6px;font-size:13px">Profite pour préparer la suite dans l'onglet Soir.</div>
        </div>`;
      return;
    }

    const now = nowMinutes(d);
    let currentIdx = -1;
    courses.forEach((c,i) => {
      const s = toMinutes(c.start), e = toMinutes(c.end);
      if(now >= s && now < e) currentIdx = i;
    });

    let html = '<div class="metro"><div class="metro-rail"></div>';
    courses.forEach((c,i) => {
      const s = toMinutes(c.start), e = toMinutes(c.end);
      let cls = "stop";
      if(now >= e) cls += " past";
      else if(now >= s && now < e) cls += " current";

      let badge = "";
      if(cls.includes("current")) badge = '<span class="badge">EN COURS</span>';
      else if(now < s && (currentIdx === -1 || i === currentIdx + 1)) badge = '<span class="badge">À SUIVRE</span>';

      html += `
        <div class="${cls}">
          <div class="time">${c.start}<span class="end">${c.end}</span></div>
          <div class="node"><div class="ring"></div></div>
          <div class="body">
            <div class="subject">${iconFor(c.subject)}${escapeHtml(c.subject)}</div>
            <div class="teacher">${escapeHtml(c.teacher)}</div>
            ${badge}
          </div>
        </div>`;
    });
    html += "</div>";
    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET SOIR
     ============================================================ */

  function renderEvening(){
    const d = new Date();
    const tomorrowIdx = (d.getDay() + 1) % 7;
    const courses = SCHEDULE[tomorrowIdx];
    const container = $("#eveningContent");

    $("#tomorrowDay").innerHTML = "Demain — <b>" + DAY_NAMES[tomorrowIdx] + "</b>";

    if(!courses || courses.length === 0){
      container.innerHTML = `
        <div class="empty">
          <div class="big">☕</div>
          <div>Pas de cours demain (${DAY_NAMES[tomorrowIdx]}).</div>
          <div style="margin-top:6px;font-size:13px">Repose-toi bien.</div>
        </div>`;
      return;
    }

    let html = "";
    courses.forEach(c => {
      const key = c.subject;
      const bullets = FICHES[key] || [
        "Relire le cours et les notes",
        "Préparer les questions à poser",
        "Faire une fiche mémo de 5 lignes"
      ];
      html += `
        <div class="card fiche">
          <h3>${iconFor(c.subject)}${escapeHtml(c.subject)}</h3>
          <div class="meta">${c.start} – ${c.end} · ${escapeHtml(c.teacher)}</div>
          <ul>
            ${bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
          </ul>
        </div>`;
    });
    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET COURS
     ============================================================ */

  function renderCourses(filter){
    const q = (filter || "").trim().toLowerCase();
    const container = $("#coursesContent");
    let html = "";

    const levels = [
      {key:"3BT", cls:"lvl-3"},
      {key:"2BT", cls:"lvl-2"},
      {key:"1BT", cls:"lvl-1"}
    ];

    levels.forEach(lv => {
      const items = SUBJECTS[lv.key].filter(([name]) =>
        !q || name.toLowerCase().includes(q)
      );
      if(items.length === 0) return;
      html += `
        <div class="level-group">
          <div class="level-head">
            <span class="level-pill ${lv.cls}">${lv.key}</span>
            <span class="count">${items.length} matière${items.length>1?"s":""}</span>
          </div>
          <div class="subject-list">
            ${items.map(([name]) => `
              <div class="subject-item">
                <span class="ico">${iconFor(name)}</span>
                <span class="name">${escapeHtml(name)}</span>
              </div>`).join("")}
          </div>
        </div>`;
    });

    // Sigles
    const sigleEntries = Object.entries(SIGLES).filter(([code,def]) =>
      !q || code.toLowerCase().includes(q) || def.toLowerCase().includes(q)
    );
    if(sigleEntries.length > 0){
      html += `
        <div class="level-group">
          <div class="level-head">
            <span class="level-pill lvl-3">SIGLES TLT</span>
            <span class="count">${sigleEntries.length} entrée${sigleEntries.length>1?"s":""}</span>
          </div>
          <div class="sigles-grid">
            ${sigleEntries.map(([code,def]) => `
              <div class="sigle">
                <div class="code">${escapeHtml(code)}</div>
                <div class="def">${escapeHtml(def)}</div>
              </div>`).join("")}
          </div>
        </div>`;
    }

    if(!html){
      html = `<div class="empty"><div class="big">🔍</div><div>Aucun résultat pour « ${escapeHtml(filter)} ».</div></div>`;
    }

    container.innerHTML = html;
  }

  /* ============================================================
     ONGLET COACH — Simulateur douanier
     ============================================================ */

  function computeDuty(){
    const fob = parseFloat($("#fob").value) || 0;
    const fret = parseFloat($("#fret").value) || 0;
    const assurance = parseFloat($("#assurance").value) || 0;

    if(fob <= 0){
      alert("Veuillez saisir une valeur FOB supérieure à 0.");
      return;
    }

    const cif = fob + fret + assurance;
    const dd = cif * 0.10;
    const rsta = cif * 0.01;
    const baseTva = cif + dd + rsta;
    const tva = baseTva * 0.18;
    const total = dd + rsta + tva;
    const totalGeneral = cif + total;

    const result = {fob, fret, assurance, cif, dd, rsta, tva, total, totalGeneral};

    const box = $("#dutyResult");
    box.innerHTML = `
      <div class="result-row"><span class="k">Valeur FOB</span><span class="v">${fmtFCFA(fob)}</span></div>
      <div class="result-row"><span class="k">+ Fret</span><span class="v">${fmtFCFA(fret)}</span></div>
      <div class="result-row"><span class="k">+ Assurance</span><span class="v">${fmtFCFA(assurance)}</span></div>
      <div class="result-row"><span class="k"><b>Valeur CIF</b></span><span class="v amber">${fmtFCFA(cif)}</span></div>
      <div class="result-row"><span class="k">Droit de Douane (10 %)</span><span class="v">${fmtFCFA(dd)}</span></div>
      <div class="result-row"><span class="k">RSTA (1 %)</span><span class="v">${fmtFCFA(rsta)}</span></div>
      <div class="result-row"><span class="k">Base TVA (CIF + DD + RSTA)</span><span class="v">${fmtFCFA(baseTva)}</span></div>
      <div class="result-row"><span class="k">TVA (18 %)</span><span class="v">${fmtFCFA(tva)}</span></div>
      <div class="result-row"><span class="k">Total taxes</span><span class="v rose">${fmtFCFA(total)}</span></div>
      <div class="result-row total"><span class="k">Coût total (CIF + taxes)</span><span class="v">${fmtFCFA(totalGeneral)}</span></div>
    `;
    box.classList.add("show");

    store.calcCount = (store.calcCount || 0) + 1;
    store.lastCalc = result;
    saveStore(store);
    $("#calcCount").textContent = store.calcCount;
  }

  function resetDuty(){
    $("#fob").value = "";
    $("#fret").value = "";
    $("#assurance").value = "";
    $("#dutyResult").classList.remove("show");
    $("#dutyResult").innerHTML = "";
  }

  /* ============================================================
     CONVERTISSEUR
     ============================================================ */

  const RATES = {EUR: 656, USD: 605};

  function convert(rate, label){
    const amount = parseFloat($("#convAmount").value) || 0;
    if(amount <= 0){
      alert("Veuillez saisir un montant supérieur à 0.");
      return;
    }
    const result = amount * rate;
    $("#convOut").style.display = "block";
    $("#convBig").textContent = fmtFCFA(result);
    $("#convSmall").textContent = `${fmtNum(amount)} ${label} × ${rate} FCFA`;
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */

  function switchTab(name){
    $$(".tab").forEach(t => t.classList.remove("active"));
    $$(".nav-btn").forEach(b => b.classList.remove("active"));
    const tab = $("#tab-" + name);
    const btn = document.querySelector(`.nav-btn[data-tab="${name}"]`);
    if(tab) tab.classList.add("active");
    if(btn) btn.classList.add("active");
    window.scrollTo({top:0, behavior:"smooth"});
  }

  /* ============================================================
     INIT
     ============================================================ */

  function init(){
    updateHeader();
    setInterval(updateHeader, 1000);

    renderToday();
    renderEvening();
    renderCourses("");
    $("#calcCount").textContent = store.calcCount || 0;

    // Rafraîchir l'onglet Aujourd'hui toutes les 30 s
    setInterval(renderToday, 30000);

    // Navigation
    $$(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    // Recherche
    $("#searchInput").addEventListener("input", (e) => {
      renderCourses(e.target.value);
    });

    // Simulateur
    $("#calcBtn").addEventListener("click", computeDuty);
    $("#resetBtn").addEventListener("click", resetDuty);

    // Convertisseur
    $("#convEurBtn").addEventListener("click", () => convert(RATES.EUR, "EUR"));
    $("#convUsdBtn").addEventListener("click", () => convert(RATES.USD, "USD"));
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
